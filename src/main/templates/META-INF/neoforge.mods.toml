modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL = "https://github.com/Black-Moss/JAOPCA-ExDeorum/issues"


[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "${mod_authors}"
description = "${mod_description}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/jaopca-exdeorum"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${ mod_id }]]
modId = "jaopca"
type = "required"
versionRange = "[5.0.14.23,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "exdeorum"
type = "required"
versionRange = "[3.12,)"
ordering = "AFTER"
side = "BOTH"
